# Conexión a la base de datos
# Las credenciales NO se versionan: se toman de las variables de entorno
# DB_USER, DB_PASSWORD y, opcionalmente, DB_URL (ver HibernateUtil y el README).
hibernate.connection.url=jdbc:mysql://localhost:3306/Proyecto2
hibernate.connection.username=
hibernate.connection.password=


# Echo all executed SQL to console
hibernate.show_sql=false
hibernate.format_sql=true
hibernate.highlight_sql=true


# El esquema lo versiona Flyway (src/main/resources/db/migrations), no Hibernate
hibernate.hbm2ddl.auto=none
